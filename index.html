<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>謝金請求書 | JSK</title><link rel="stylesheet" href="style.css"></head><body><header><span class="brand">JSK<span>ケルン日本語補習校</span></span><span class="tag">謝金請求書</span></header><main><section class="controls"><div class="intro"><small>RECHNUNG</small><h1>謝金請求書を作成</h1><p>Excelを読み込み、講師と対象月を選んでください。</p></div><label class="upload">勤怠Excelを選択<input id="file" type="file" accept=".xlsx"><span id="filename">.xlsx ファイル</span></label><p class="hint">ファイルはこのブラウザ内で処理します。閉じると入力内容は消えます。</p><p id="status" role="status"></p><fieldset id="form" disabled><div class="twocol"><label>講師<select id="teacher"></select></label><label>対象年月<select id="month"></select></label></div><div class="twocol"><label>請求日<input id="date" type="date"></label><label>請求書番号<input id="number"></label></div><h2>請求する項目</h2><div id="categories"></div><h2>追加明細</h2><div id="extras"></div><button type="button" id="add" class="secondary">＋ 明細を追加</button><label class="confirm"><input type="checkbox" id="confirmed">明細・金額・振込先を確認しました</label><button id="print" disabled>PDF保存 / 印刷</button><p class="hint">印刷画面の送信先で「PDFに保存」を選択。用紙はA4、ヘッダーとフッターはオフにしてください。</p></fieldset></section><section class="preview"><div class="previewhead"><span>請求書プレビュー</span><span>A4 · Deutsch</span></div><div id="empty"><span class="papericon">€</span><h2>ここに請求書が表示されます</h2><p>左のボタンから勤怠Excelを選択してください。</p></div><article id="invoice" hidden></article></section></main><script type="module" src="app.js?v=20260922-class"></script></body></html>
